<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Test Login</h1>
    
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" value="testuser">
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="password123">
    </div>
    
    <button id="login-btn">Login</button>
    
    <div id="message"></div>
    
    <h2>Response:</h2>
    <div id="result"></div>
    
    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const resultEl = document.getElementById('result');
            
            if (!username || !password) {
                messageEl.className = 'error';
                messageEl.textContent = 'Username and password are required';
                return;
            }
            
            try {
                messageEl.textContent = 'Logging in...';
                
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                resultEl.textContent = JSON.stringify(data, null, 2);
                
                if (response.ok) {
                    messageEl.className = 'success';
                    messageEl.textContent = 'Login successful!';
                    
                    // Test the /me endpoint
                    setTimeout(async () => {
                        try {
                            const meResponse = await fetch('http://localhost:5001/api/auth/me', {
                                credentials: 'include'
                            });
                            
                            const meData = await meResponse.json();
                            resultEl.textContent += '\n\n/me endpoint response:\n' + JSON.stringify(meData, null, 2);
                        } catch (err) {
                            resultEl.textContent += '\n\nError fetching /me endpoint: ' + err.message;
                        }
                    }, 1000);
                } else {
                    messageEl.className = 'error';
                    messageEl.textContent = data.message || 'Login failed';
                }
            } catch (err) {
                messageEl.className = 'error';
                messageEl.textContent = 'Error: ' + err.message;
                resultEl.textContent = err.stack || err.message;
            }
        });
    </script>
</body>
</html>
